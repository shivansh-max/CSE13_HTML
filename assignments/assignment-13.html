<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Assignment 13: Rowspan and Colspan (Timetable)</title>
    <style>
        body {
            font: 18px Georgia, serif;
            line-height: 1.5;
            max-width: 900px;
            margin: 2rem auto;
            padding: 1rem;
            color: #202536
        }

        a {
            color: #174b9b
        }

        a:focus,
        button:focus,
        input:focus,
        select:focus,
        textarea:focus {
            outline: 3px solid orange
        }

        .block {
            background: lightblue;
            margin: 4px
        }

        .inline {
            background: lightgreen
        }

        .nav {
            display: flex;
            gap: 2rem;
            background: #333;
            padding: 1rem;
            list-style: none
        }

        .nav a {
            color: white
        }

        .skip {
            position: absolute;
            left: -9999px
        }

        .skip:focus {
            left: 1rem;
            background: white
        }

        .field {
            display: grid;
            margin: 1rem 0;
            max-width: 30rem
        }

        input,
        textarea,
        select,
        button {
            font: inherit;
            padding: .3rem
        }

        table {
            border-collapse: collapse;
            margin: 1rem 0
        }

        caption {
            font-weight: bold
        }

        th,
        td {
            border: 1px solid #555;
            padding: .4rem
        }

        th {
            background: #e9ebf4
        }

        .scroll {
            overflow: auto
        }

        .scroll table {
            min-width: 600px
        }

        fieldset {
            margin: 1rem 0;
            padding: 1rem
        }

        .hero,
        footer {
            background: #1e2a78;
            color: white;
            text-align: center;
            padding: 1rem
        }

        @media(max-width:600px) {
            body {
                padding: .7rem
            }

            img,
            video,
            iframe {
                max-width: 100%;
                height: auto
            }
        }
    </style>
</head>

<body>
    <table>
        <caption>Weekly Timetable</caption>
        <thead>
            <tr>
                <th>Day</th>
                <th>9-10</th>
                <th>10-11</th>
                <th>11-12</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th>Mon</th>
                <td>Maths</td>
                <td>HTML</td>
                <td rowspan="2">Web Lab</td>
            </tr>
            <tr>
                <th>Tue</th>
                <td>DBMS</td>
                <td>OS</td>
            </tr>
            <tr>
                <th>Wed</th>
                <td colspan="3">Seminar</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
