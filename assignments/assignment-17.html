<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Assignment 17: Form Attributes and Input Validation</title>
    <style>
        body {
            font: 18px Georgia, serif;
            line-height: 1.5;
            max-width: 900px;
            margin: 2rem auto;
            padding: 1rem;
            color: #202536
        }

        a {
            color: #174b9b
        }

        a:focus,
        button:focus,
        input:focus,
        select:focus,
        textarea:focus {
            outline: 3px solid orange
        }

        .block {
            background: lightblue;
            margin: 4px
        }

        .inline {
            background: lightgreen
        }

        .nav {
            display: flex;
            gap: 2rem;
            background: #333;
            padding: 1rem;
            list-style: none
        }

        .nav a {
            color: white
        }

        .skip {
            position: absolute;
            left: -9999px
        }

        .skip:focus {
            left: 1rem;
            background: white
        }

        .field {
            display: grid;
            margin: 1rem 0;
            max-width: 30rem
        }

        input,
        textarea,
        select,
        button {
            font: inherit;
            padding: .3rem
        }

        table {
            border-collapse: collapse;
            margin: 1rem 0
        }

        caption {
            font-weight: bold
        }

        th,
        td {
            border: 1px solid #555;
            padding: .4rem
        }

        th {
            background: #e9ebf4
        }

        .scroll {
            overflow: auto
        }

        .scroll table {
            min-width: 600px
        }

        fieldset {
            margin: 1rem 0;
            padding: 1rem
        }

        .hero,
        footer {
            background: #1e2a78;
            color: white;
            text-align: center;
            padding: 1rem
        }

        @media(max-width:600px) {
            body {
                padding: .7rem
            }

            img,
            video,
            iframe {
                max-width: 100%;
                height: auto
            }
        }
    </style>
</head>

<body>
    <p>Test empty form, invalid email, short mobile, short password, and age over 30.</p>
    <form action="submit.php" method="post">
        <div class="field"><label for="nm">Full name</label><input id="nm" required minlength="2"></div>
        <div class="field"><label for="em">Email</label><input id="em" type="email" placeholder="you@college.edu"
                required></div>
        <div class="field"><label for="mob">Mobile</label><input id="mob" type="tel" pattern="[0-9]{10}"
                title="Enter exactly 10 digits" placeholder="10-digit mobile" required></div>
        <div class="field"><label for="pass">Password</label><input id="pass" type="password" minlength="6" required>
        </div>
        <div class="field"><label for="age">Age</label><input id="age" type="number" min="17" max="30" required></div>
        <button>Register</button>
    </form>
    <p>A server-side submit.php is required to process the POST.</p>
</body>

</html>
